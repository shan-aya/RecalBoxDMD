name: Sync firmware version

# La version du firmware est lue DANS le binaire publie (chaine "RBDMD_FWVER=M.mm;" ajoutee au firmware v2.36,
# generee a la compilation a partir de FW_VERSION_NUM) puis recopiee dans :
#   - docs/install/manifest.json  (page d'installation + page d'accueil)
#   - la cle "scripts" du manifeste = SCRIPTS_BUNDLE de dmd_udp_resync.py (numero d'ensemble des scripts Recalbox)
#   - les cles "app_sha256" / "app_size" du manifeste = empreinte SHA-256 et taille de binaries/RecalBoxDMD_v2.0_app.bin
#     (firmware 2.44+ : le DMD telecharge lui-meme ce fichier et refuse de l'installer si la taille ou l'empreinte ne correspondent pas)
#   - le badge "firmware-vM.mm" des trois README
# Plus aucun numero a changer a la main a chaque publication. Binaire sans marqueur (firmware <= 2.35) : rien n'est modifie.

on:
  push:
    branches: [main]
    paths:
      - "binaries/RecalBoxDMD_v2.0_merged.bin"
      - "binaries/RecalBoxDMD_v2.0_app.bin"
      - "tools/recalbox_scripts/dmd_helpers/dmd_udp_resync.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync the scripts bundle number into the manifest
        shell: python
        run: |
          import re, sys
          src = open("tools/recalbox_scripts/dmd_helpers/dmd_udp_resync.py", "rb").read()
          m = re.search(rb"^SCRIPTS_BUNDLE\s*=\s*(\d+)", src, re.M)
          if not m:
              print("::warning::SCRIPTS_BUNDLE introuvable dans dmd_udp_resync.py - manifeste inchange")
              sys.exit(0)
          raw = open("docs/install/manifest.json", "rb").read()
          new, n = re.subn(rb'("scripts"\s*:\s*)\d+', rb"\g<1>" + m.group(1), raw)
          if n != 1:
              print(f"::error::manifest.json : {n} occurrence(s) de la cle scripts (1 attendue)")
              sys.exit(1)
          if new != raw:
              open("docs/install/manifest.json", "wb").write(new)
          print("numero d'ensemble des scripts :", m.group(1).decode())

      - name: Read version from the binary and update files
        id: ver
        shell: python
        run: |
          import os, re, sys
          data = open("binaries/RecalBoxDMD_v2.0_merged.bin", "rb").read()
          found = set(re.findall(rb"RBDMD_FWVER=([0-9]\.[0-9]{2});", data))
          if len(found) != 1:
              print(f"::warning::marqueur de version absent ou ambigu ({sorted(found)}) - rien a synchroniser")
              open(os.environ["GITHUB_OUTPUT"], "a").write("changed=false\n")
              sys.exit(0)
          ver = next(iter(found)).decode()
          print("version du binaire :", ver)

          def sub(path, pattern, repl):
              raw = open(path, "rb").read()
              new, n = re.subn(pattern, repl, raw)
              if n != 1:
                  print(f"::error::{path} : {n} occurrence(s) du motif (1 attendue)")
                  sys.exit(1)
              if new != raw:
                  open(path, "wb").write(new)

          v = ver.encode()
          sub("docs/install/manifest.json", rb'("version"\s*:\s*")[^"]*(")', rb"\g<1>" + v + rb"\g<2>")
          for readme in ("README.md", "README.fr.md", "README.es.md"):
              sub(readme, rb'(alt="Firmware ?: v)[0-9]\.[0-9]{2}', rb"\g<1>" + v)
              sub(readme, rb"(badge/firmware-v)[0-9]\.[0-9]{2}", rb"\g<1>" + v)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"changed=true\nversion={ver}\n")

      - name: Record size and SHA-256 of the app image in the manifest (used by the DMD for Wi-Fi updates)
        shell: python
        run: |
          import hashlib, re, sys
          app = open("binaries/RecalBoxDMD_v2.0_app.bin", "rb").read()
          merged = open("binaries/RecalBoxDMD_v2.0_merged.bin", "rb").read()
          mark = re.compile(rb"RBDMD_FWVER=([0-9]\.[0-9]{2});")
          va, vm = set(mark.findall(app)), set(mark.findall(merged))
          if va != vm or len(va) != 1:
              print(f"::error::versions incoherentes entre app.bin {sorted(va)} et merged.bin {sorted(vm)} - manifeste inchange")
              sys.exit(1)
          sha = hashlib.sha256(app).hexdigest().encode()
          size = str(len(app)).encode()
          raw = open("docs/install/manifest.json", "rb").read()
          nl = b"\r\n" if b"\r\n" in raw else b"\n"
          base = re.sub(rb'\s*"app_sha256"\s*:\s*"[^"]*",?', b"", raw)
          base = re.sub(rb'\s*"app_size"\s*:\s*\d+,?', b"", base)
          new, n = re.subn(rb'("scripts"\s*:\s*\d+,)', rb"\g<1>" + nl + b'  "app_sha256": "' + sha + b'",' + nl + b'  "app_size": ' + size + b",", base)
          if n != 1:
              print(f"::error::manifest.json : {n} occurrence(s) de la cle scripts (1 attendue)")
              sys.exit(1)
          if new != raw:
              open("docs/install/manifest.json", "wb").write(new)
          print("app.bin :", size.decode(), "octets, sha256", sha.decode())

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Deja a jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/install/manifest.json README.md README.fr.md README.es.md
          git commit -m "Web Installer et badges - version du firmware ${{ steps.ver.outputs.version }} (lue dans le binaire)"
          git push
