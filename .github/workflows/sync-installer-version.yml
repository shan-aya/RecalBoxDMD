name: Sync firmware version

# La version du firmware est lue DANS le binaire publie (chaine "RBDMD_FWVER=M.mm;" ajoutee au firmware v2.36,
# generee a la compilation a partir de FW_VERSION_NUM) puis recopiee dans :
#   - docs/install/manifest.json  (page d'installation + page d'accueil)
#   - la cle "scripts" du manifeste = SCRIPTS_BUNDLE de dmd_udp_resync.py (numero d'ensemble des scripts Recalbox)
#   - les cles "app_sha256" / "app_size" du manifeste = empreinte SHA-256 et taille de binaries/RecalBoxDMD_app.bin
#     (firmware 2.44+ : le DMD telecharge lui-meme ce fichier et refuse de l'installer si la taille ou l'empreinte ne correspondent pas)
#   - le badge "firmware-vM.mm" des trois README
# binaries/RecalBoxDMD_v2.0_app.bin = copie HISTORIQUE de RecalBoxDMD_app.bin (les DMD en firmware 2.44-2.64 la telechargent a cette adresse) : le workflow echoue si elle differe.
# Plus aucun numero a changer a la main a chaque publication. Binaire sans marqueur (firmware <= 2.35) : rien n'est modifie.

on:
  push:
    branches: [main, alpha]   # CANAUX : ce fichier est IDENTIQUE sur main (stable) et alpha ; tout se deduit du nom de la branche (survit aux fusions)
    paths:
      - "docs/install/manifest.json"           # apres une fusion alpha -> main : le chemin du binaire et le canal sont remis a ceux de la branche
      - "tools/RecalBoxDMD_tool_v*/RecalBoxDMD_tool.py"   # constante BUILD_CHANNEL de la boite a outils
      - "raspberry-pi/rpi_daemon/PI_CHANNEL"               # canal verrouille du demon Pi
      - "binaries/RecalBoxDMD_merged.bin"
      - "binaries/RecalBoxDMD_app.bin"
      - "binaries/RecalBoxDMD_v2.0_app.bin"   # copie HISTORIQUE (meme contenu) : adresse codee en dur dans les firmwares 2.44 a 2.64
      - "tools/recalbox_scripts/dmd_helpers/dmd_udp_resync.py"
  release:
    types: [published]   # nouvelle release du toolkit : la cle "toolkit" du manifeste est mise a jour (avis affiche par les pages web du DMD)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # CANAUX : `main` = STABLE, `alpha` = alpha. Branche cible = la branche poussee ; pour une release : pre-release -> alpha, release -> main
    # (une release alpha n'ecrit donc JAMAIS ses numeros dans le manifeste stable).
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'alpha' || 'main') || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'alpha' || 'main') || github.ref_name }}   # evenement release : sans cela le checkout serait en tete detachee (sur le tag) et le push echouerait

      - name: Lock the channel to the branch (stable on main, alpha on alpha)
        shell: python
        run: |
          import glob, os, re, sys
          br = os.environ["BRANCH"]
          if br not in ("main", "alpha"):
              print("::warning::branche", br, "- ni main ni alpha : canal inchange")
              sys.exit(0)
          chan = "stable" if br == "main" else "alpha"
          # 1) binaire du manifeste : toujours celui de la branche (apres une fusion alpha -> main il pointerait sur /alpha/)
          p = "docs/install/manifest.json"
          raw = open(p, "rb").read()
          new = re.sub(rb"(RecalBoxDMD/)(?:main|alpha)(/binaries/)", rb"\g<1>" + br.encode() + rb"\g<2>", raw)
          if new != raw:
              open(p, "wb").write(new)
              print("manifeste : binaire remis sur la branche", br)
          # 2) canal verrouille de la boite a outils (constante BUILD_CHANNEL du build le plus recent)
          tools = sorted(glob.glob("tools/RecalBoxDMD_tool_v*/RecalBoxDMD_tool.py"),
                         key=lambda f: int(re.search(r"_tool_v(\d+)", f).group(1)))
          if not tools:
              print("::warning::aucune boite a outils trouvee - canal non verrouille")
              sys.exit(0)
          # 2b) canal verrouille du demon Pi (fichier PI_CHANNEL embarque dans la charge utile) : present seulement une fois le demon publie dans le depot
          pc = "raspberry-pi/rpi_daemon/PI_CHANNEL"
          if os.path.exists(pc):
              want = (chan + "\n").encode()
              if open(pc, "rb").read() != want:
                  open(pc, "wb").write(want)
                  print("PI_CHANNEL =", chan)
          f = tools[-1]
          src = open(f, "rb").read()
          out, n = re.subn(rb'^(BUILD_CHANNEL\s*=\s*)"[a-z]+"', rb'\g<1>"' + chan.encode() + rb'"', src, flags=re.M)
          if n == 0:
              print("::warning::", f, ": pas de BUILD_CHANNEL (boite a outils anterieure aux canaux) - rien a verrouiller")
              sys.exit(0)
          if n != 1:
              print("::error::", f, ":", n, "occurrences de BUILD_CHANNEL (1 attendue)")
              sys.exit(1)
          if out != src:
              open(f, "wb").write(out)
              print("BUILD_CHANNEL =", chan, "dans", f)

      - name: Refuse a firmware binary built for the OTHER channel
        shell: python
        run: |
          import os, re, sys
          br = os.environ["BRANCH"]
          if br not in ("main", "alpha"):
              sys.exit(0)
          chan = "stable" if br == "main" else "alpha"
          bad = False
          for p in ("binaries/RecalBoxDMD_app.bin", "binaries/RecalBoxDMD_merged.bin"):
              found = set(re.findall(rb"RBDMD_CHAN=(stable|alpha);", open(p, "rb").read()))
              if not found:
                  print(f"::warning::{p} : pas de marqueur de canal (firmware anterieur aux canaux) - non verifie")
              elif found != {chan.encode()}:
                  print(f"::error::{p} : binaire du canal {sorted(x.decode() for x in found)} publie sur la branche {br} (canal {chan} attendu). "
                        f"Recompiler : compile.ps1 {'-Channel alpha' if chan == 'alpha' else '(sans -Channel)'}")
                  bad = True
              else:
                  print(f"{p} : canal {chan} conforme a la branche {br}")
          if bad:
              sys.exit(1)

      - name: Sync the scripts bundle number into the manifest
        shell: python
        run: |
          import re, sys
          src = open("tools/recalbox_scripts/dmd_helpers/dmd_udp_resync.py", "rb").read()
          m = re.search(rb"^SCRIPTS_BUNDLE\s*=\s*(\d+)", src, re.M)
          if not m:
              print("::warning::SCRIPTS_BUNDLE introuvable dans dmd_udp_resync.py - manifeste inchange")
              sys.exit(0)
          raw = open("docs/install/manifest.json", "rb").read()
          new, n = re.subn(rb'("scripts"\s*:\s*)\d+', rb"\g<1>" + m.group(1), raw)
          if n != 1:
              print(f"::error::manifest.json : {n} occurrence(s) de la cle scripts (1 attendue)")
              sys.exit(1)
          if new != raw:
              open("docs/install/manifest.json", "wb").write(new)
          print("numero d'ensemble des scripts :", m.group(1).decode())

      - name: Read version from the binary and update files
        id: ver
        shell: python
        run: |
          import os, re, sys
          data = open("binaries/RecalBoxDMD_merged.bin", "rb").read()
          found = set(re.findall(rb"RBDMD_FWVER=([0-9]\.[0-9]{2});", data))
          if len(found) != 1:
              print(f"::warning::marqueur de version absent ou ambigu ({sorted(found)}) - rien a synchroniser")
              open(os.environ["GITHUB_OUTPUT"], "a").write("changed=false\n")
              sys.exit(0)
          ver = next(iter(found)).decode()
          print("version du binaire :", ver)

          def sub(path, pattern, repl):
              raw = open(path, "rb").read()
              new, n = re.subn(pattern, repl, raw)
              if n != 1:
                  print(f"::error::{path} : {n} occurrence(s) du motif (1 attendue)")
                  sys.exit(1)
              if new != raw:
                  open(path, "wb").write(new)

          v = ver.encode()
          sub("docs/install/manifest.json", rb'("version"\s*:\s*")[^"]*(")', rb"\g<1>" + v + rb"\g<2>")
          for readme in ("README.md", "README.fr.md", "README.es.md"):
              sub(readme, rb'(alt="Firmware ?: v)[0-9]\.[0-9]{2}', rb"\g<1>" + v)
              sub(readme, rb"(badge/firmware-v)[0-9]\.[0-9]{2}", rb"\g<1>" + v)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"changed=true\nversion={ver}\n")

      - name: Record size and SHA-256 of the app image in the manifest (used by the DMD for Wi-Fi updates)
        shell: python
        run: |
          import hashlib, re, sys
          app = open("binaries/RecalBoxDMD_app.bin", "rb").read()
          merged = open("binaries/RecalBoxDMD_merged.bin", "rb").read()
          mark = re.compile(rb"RBDMD_FWVER=([0-9]\.[0-9]{2});")
          va, vm = set(mark.findall(app)), set(mark.findall(merged))
          if va != vm or len(va) != 1:
              print(f"::error::versions incoherentes entre app.bin {sorted(va)} et merged.bin {sorted(vm)} - manifeste inchange")
              sys.exit(1)
          sha = hashlib.sha256(app).hexdigest().encode()
          size = str(len(app)).encode()
          raw = open("docs/install/manifest.json", "rb").read()
          nl = b"\r\n" if b"\r\n" in raw else b"\n"
          base = re.sub(rb'\s*"app_sha256"\s*:\s*"[^"]*",?', b"", raw)
          base = re.sub(rb'\s*"app_size"\s*:\s*\d+,?', b"", base)
          new, n = re.subn(rb'("scripts"\s*:\s*\d+,)', rb"\g<1>" + nl + b'  "app_sha256": "' + sha + b'",' + nl + b'  "app_size": ' + size + b",", base)
          if n != 1:
              print(f"::error::manifest.json : {n} occurrence(s) de la cle scripts (1 attendue)")
              sys.exit(1)
          if new != raw:
              open("docs/install/manifest.json", "wb").write(new)
          print("app.bin :", size.decode(), "octets, sha256", sha.decode())

      - name: Check the legacy v2.0 copy is identical to RecalBoxDMD_app.bin (Wi-Fi updates of firmware 2.44-2.64)
        shell: python
        run: |
          import os, sys
          p = "binaries/RecalBoxDMD_v2.0_app.bin"
          if not os.path.exists(p):
              print("::error::binaries/RecalBoxDMD_v2.0_app.bin absent : les DMD en firmware 2.44-2.64 ne pourraient plus se mettre a jour")
              sys.exit(1)
          if open(p, "rb").read() != open("binaries/RecalBoxDMD_app.bin", "rb").read():
              print("::error::binaries/RecalBoxDMD_v2.0_app.bin differe de RecalBoxDMD_app.bin : recopier RecalBoxDMD_app.bin sous l'ancien nom")
              sys.exit(1)
          print("copie v2.0 identique a RecalBoxDMD_app.bin")

      - name: Record the latest PC toolkit build in the manifest (notice shown by the DMD web pages)
        shell: python
        run: |
          import json, os, re, sys, urllib.request
          alpha = os.environ.get("BRANCH") == "alpha"
          # stable : derniere release NORMALE (releases/latest exclut les pre-releases) ; alpha : boite a outils au plus grand numero parmi les PRE-RELEASES seulement (jamais une release stable : sinon les testeurs alpha seraient invites a telecharger un toolkit stable)
          req = urllib.request.Request("https://api.github.com/repos/${{ github.repository }}/releases" + ("?per_page=30" if alpha else "/latest"),
                                       headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer ${{ secrets.GITHUB_TOKEN }}", "User-Agent": "sync-installer-version"})
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
              if alpha:
                  builds = [int(m.group(1)) for r in data if not r.get("draft") and r.get("prerelease")
                            for m in [re.fullmatch(r"RecalBoxDMD_tool_v(\d+)", str(r.get("tag_name", "")))] if m]
                  tag = ("RecalBoxDMD_tool_v%d" % max(builds)) if builds else ""
              else:
                  tag = str(data.get("tag_name", ""))
          except Exception as e:
              print(f"::warning::derniere release illisible ({e}) - cle toolkit inchangee")
              sys.exit(0)
          m = re.search(r"_v(\d+)$", tag)
          if not m:
              print(f"::warning::tag de release inattendu ({tag}) - cle toolkit inchangee")
              sys.exit(0)
          raw = open("docs/install/manifest.json", "rb").read()
          nl = b"\r\n" if b"\r\n" in raw else b"\n"
          mt = m.group(1).encode()   # le tag est une chaine : les motifs ci-dessous sont des octets
          if b'"toolkit"' in raw:
              new, n = re.subn(rb'("toolkit"\s*:\s*)\d+', rb"\g<1>" + mt, raw)
          else:
              new, n = re.subn(rb'("scripts"\s*:\s*\d+,)', rb"\g<1>" + nl + b'  "toolkit": ' + mt + b",", raw)
          if n != 1:
              print(f"::error::manifest.json : {n} occurrence(s) pour la cle toolkit (1 attendue)")
              sys.exit(1)
          if new != raw:
              open("docs/install/manifest.json", "wb").write(new)
          print("dernier toolkit publie : build", m.group(1))

      - name: Record the latest Raspberry Pi daemon version in the manifest (notice + update button of the Pi web pages)
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import os, re, sys
          tag = os.environ.get("RELEASE_TAG", "")
          m = re.fullmatch(r"pi-v(\d+\.\d+)", tag)
          if not m:
              print("pas une release du demon Raspberry Pi (", tag or "aucun tag", ") - cle pi inchangee")
              sys.exit(0)
          raw = open("docs/install/manifest.json", "rb").read()
          nl = b"\r\n" if b"\r\n" in raw else b"\n"
          val = b'"' + m.group(1).encode() + b'"'
          if b'"pi"' in raw:
              new, n = re.subn(rb'("pi"\s*:\s*)"[^"]*"', rb"\g<1>" + val, raw)
          else:
              new, n = re.subn(rb'("toolkit"\s*:\s*\d+,)', rb"\g<1>" + nl + b'  "pi": ' + val + b",", raw)
          if n != 1:
              print(f"::error::manifest.json : {n} occurrence(s) pour la cle pi (1 attendue)")
              sys.exit(1)
          if new != raw:
              open("docs/install/manifest.json", "wb").write(new)
          print("derniere version du demon Pi publiee :", m.group(1))

      - name: Warn if an alpha build number is not above the stable one (toolkit builds and Pi daemon versions)
        shell: python
        run: |
          # GARDE-FOU DE NUMEROTATION (jamais bloquant) : les annonces d'un canal ne lisent que ses propres releases (alpha = pre-releases, stable = releases normales),
          # mais les anciens clients (boite a outils alpha 164100, demon Pi 3.94 / 3.95) prennent le plus grand numero de TOUTES les releases : un build alpha au numero
          # inferieur ou egal au dernier stable leur serait invisible, et un stable plus haut leur serait propose. Regle : alpha > stable (voir CHANNELS.md).
          import json, os, re, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/${{ github.repository }}/releases?per_page=100",
                                       headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer ${{ secrets.GITHUB_TOKEN }}", "User-Agent": "sync-installer-version"})
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
          except Exception as e:
              print(f"::warning::liste des releases illisible ({e}) - garde-fou de numerotation saute")
              raise SystemExit(0)
          def best(pattern, pre, key):
              vals = [key(m) for r in data if not r.get("draft") and bool(r.get("prerelease")) == pre
                      for m in [re.fullmatch(pattern, str(r.get("tag_name", "")))] if m]
              return max(vals) if vals else None
          def fmt(v):
              return "%d.%02d" % v if isinstance(v, tuple) else str(v)
          lines = []
          for label, pattern, key in (("Toolkit build", r"RecalBoxDMD_tool_v(\d+)", lambda m: int(m.group(1))),
                                      ("Pi daemon", r"pi-v(\d+)\.(\d+)", lambda m: (int(m.group(1)), int(m.group(2))))):
              a, st = best(pattern, True, key), best(pattern, False, key)
              if a is None or st is None:
                  continue
              if a <= st:
                  msg = f"{label} : la derniere PRE-RELEASE alpha ({fmt(a)}) n'est pas au-dessus de la derniere release stable ({fmt(st)}). Les anciens clients alpha (boite a outils 164100, demon Pi 3.94 / 3.95) la prendraient pour plus ancienne : publier l'alpha avec un numero superieur (CHANNELS.md)."
                  print("::warning::" + msg)
                  lines.append("- " + msg)
              else:
                  print(f"{label} : alpha {fmt(a)} > stable {fmt(st)} - ok")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and lines:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### Numerotation alpha / stable\n" + "\n".join(lines) + "\n")

      - name: Normalize the title of the PC toolkit releases (rule - tool vN using with recalboxDMD v4.xx)
        shell: python
        run: |
          # REGLE DE NOMMAGE (demande utilisateur 2026-11-22 : « v2.0 » -> « v4.xx », automatique) : toute release du toolkit (tag RecalBoxDMD_tool_v<N>) porte le titre
          #   release stable  : tool v<N> using with recalboxDMD v4.xx
          #   pre-release     : tool v<N> ALPHA pre-release (portable) using with recalboxDMD v4.xx
          # Le titre est remis a la regle a CHAQUE execution (push ou release) : une release creee a la main avec un autre titre (ex. « ... recalboxDMD v2.0 ») est corrigee.
          # Les autres tags (pi-v..., *_TEST, archives) ne sont pas touches. Jamais bloquant.
          import json, re, urllib.request
          H = {"Accept": "application/vnd.github+json", "Authorization": "Bearer ${{ secrets.GITHUB_TOKEN }}", "User-Agent": "sync-installer-version", "Content-Type": "application/json"}
          API = "https://api.github.com/repos/${{ github.repository }}/releases"
          def wanted(tag, pre):
              m = re.fullmatch(r"RecalBoxDMD_tool_v(\d+)", tag)
              if not m:
                  return None
              return ("tool v%s ALPHA pre-release (portable) using with recalboxDMD v4.xx" if pre else "tool v%s using with recalboxDMD v4.xx") % m.group(1)
          try:
              rels = json.load(urllib.request.urlopen(urllib.request.Request(API + "?per_page=100", headers=H), timeout=30))
          except Exception as e:
              print(f"::warning::liste des releases illisible ({e}) - titres non normalises")
              raise SystemExit(0)
          n = 0
          for r in rels:
              if r.get("draft"):
                  continue
              want = wanted(str(r.get("tag_name", "")), bool(r.get("prerelease")))
              if want is None or r.get("name") == want:
                  continue
              try:
                  req = urllib.request.Request(API + "/" + str(r["id"]), data=json.dumps({"name": want}).encode(), headers=H, method="PATCH")
                  urllib.request.urlopen(req, timeout=30).read()
                  print(f"titre : {r.get('tag_name')} : '{r.get('name')}' -> '{want}'")
                  n += 1
              except Exception as e:
                  print(f"::warning::titre de {r.get('tag_name')} non modifie ({e})")
          print(f"{n} titre(s) normalise(s)")

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Deja a jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/install/manifest.json README.md README.fr.md README.es.md tools/RecalBoxDMD_tool_v*/RecalBoxDMD_tool.py
          [ -f raspberry-pi/rpi_daemon/PI_CHANNEL ] && git add raspberry-pi/rpi_daemon/PI_CHANNEL || true
          git commit -m "Web Installer et badges - version du firmware ${{ steps.ver.outputs.version }} (lue dans le binaire)"
          git push
