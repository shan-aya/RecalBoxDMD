<script>
const HELP_I18N=window.CFG_HELP;
const MENU_I18N={
fr:{menu_settings:'&#x2699; Réglages',title:'RecalBox DMD',tagline:'Configuration DMD',menu_basic:'&#x1F4A1; Affichage',menu_playlist:'&#x1F4BF; Playlist',menu_network:'&#x1F4F6; Wi-Fi',menu_deco:'&#x2728; Widgets &amp; Horloge',menu_media:'&#x1F4BF; Médias',menu_button:'&#x1F518; Bouton',small_hint:'Page fractionnée pour un chargement rapide et fiable sur ESP32.',...HELP_I18N.fr},
en:{menu_settings:'&#x2699; Settings',title:'RecalBox DMD',tagline:'DMD Configuration',menu_basic:'&#x1F4A1; Display',menu_playlist:'&#x1F4BF; Playlist',menu_network:'&#x1F4F6; Wi-Fi',menu_deco:'&#x2728; Widgets &amp; Clock',menu_media:'&#x1F4BF; Media',menu_button:'&#x1F518; Button',small_hint:'Split page for fast, reliable loading on ESP32.',...HELP_I18N.en},
es:{menu_settings:'&#x2699; Ajustes',title:'RecalBox DMD',tagline:'Configuración DMD',menu_basic:'&#x1F4A1; Pantalla',menu_playlist:'&#x1F4BF; Playlist',menu_network:'&#x1F4F6; Wi-Fi',menu_deco:'&#x2728; Widgets y Reloj',menu_media:'&#x1F4BF; Medios',menu_button:'&#x1F518; Botón',small_hint:'Página dividida para una carga rápida y fiable en ESP32.',...HELP_I18N.es}
};
let currentLang='fr';
function showPageLoadingOverlay(){var el=document.getElementById('pageLoadingOverlay');if(el)el.style.display='flex';}
function hidePageLoadingOverlay(){var el=document.getElementById('pageLoadingOverlay');if(el)el.style.display='none';}
function tr(k){return (MENU_I18N[currentLang]&&MENU_I18N[currentLang][k])||(window.CFG_I18N&&CFG_I18N[currentLang]&&CFG_I18N[currentLang][k])||MENU_I18N.fr[k]||(window.CFG_I18N&&CFG_I18N.fr&&CFG_I18N.fr[k])||k;}
function applyLang(backendLang){
  const stored=localStorage.getItem('dmd_lang');
  if(stored&&MENU_I18N[stored]){currentLang=stored;}
  else if(backendLang&&MENU_I18N[backendLang]){currentLang=backendLang;}
  else{const nav=(navigator.language||'').substring(0,2);currentLang=MENU_I18N[nav]?nav:'fr';}
  document.documentElement.lang=currentLang;
  document.title=tr('title');
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.innerHTML=tr(el.dataset.i18n);});
  document.getElementById('langSelect').value=currentLang;
}
function setLang(code){
  localStorage.setItem('dmd_lang',code);
  applyLang();
  fetch('/save-language',{method:'POST',body:'language='+code,headers:{'Content-Type':'application/x-www-form-urlencoded'}}).catch(function(){});
}
function showMsgLocal(t,ok){var el=document.getElementById('msg');el.textContent=t;el.className='msg '+(ok?'ok':'err');el.style.display='block';setTimeout(function(){el.style.display='none';},5000);}
// /load : lu par cfg.js au passage (version du firmware -> avis de mise a jour affiche en haut de CHAQUE page, accueil comprise)
fetch('/lang').then(function(r){return r.json();}).then(function(d){applyLang(d.language);if(d.first_boot==='1'&&!sessionStorage.getItem('dmd_help_seen')){sessionStorage.setItem('dmd_help_seen','1');showHelpModal();}}).catch(function(){applyLang();}).then(function(){return fetch('/load');}).catch(function(){}).finally(hidePageLoadingOverlay);
</script>
