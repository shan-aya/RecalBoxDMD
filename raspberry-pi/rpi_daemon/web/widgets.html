function hx(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=function(n){return(n+h/30)%12;},a=s*Math.min(l,1-l),f=function(n){const v=l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return('0'+Math.round(255*v).toString(16)).slice(-2);};return'#'+f(0)+f(8)+f(4);}

  cd.innerHTML='';const st=V.deco_amb||'0',spec=AMBC[st];if(!spec){cd.style.display='none';return;}

    const ci=document.createElement('input');ci.type='color';ci.value=V[key]||df[i]||df[0];ci.oninput=function(){V[key]=ci.value;};l.appendChild(ci);cd.appendChild(l);cis.push(ci);});
  const bA=document.createElement('button');bA.type='button';bA.className='wb';bA.textContent='AUTO';
  bA.onclick=function(){const h=Math.random()*360;let c;if(n===1)c=[hx(h,88,52)];else if(st==='8')c=[hx(h,80,Math.random()*8+16),hx(h+120+Math.random()*80,92,56)];else{const dk=Math.random()<.5;c=[hx(h,85,dk?85:28),hx(h+120+Math.random()*80,90,dk?28:82)];}
    spec.forEach(function(lbl,i){V[ks[i]]=c[i];cis[i].value=c[i];});};
  const bR=document.createElement('button');bR.type='button';bR.className='wb';bR.textContent='RAZ';
  bR.onclick=function(){spec.forEach(function(lbl,i){V[ks[i]]='';cis[i].value=df[i]||df[0];});};
  cd.appendChild(bA);cd.appendChild(bR);
}function fitCols(){   // la ligne de couleurs va du bord gauche du champ duree au bord droit de la liste des styles (mesure reelle : largeur des boutons variable selon la langue)
  const cd=document.querySelector('.wcol'),num=document.getElementById('deco_dur_4'),sel=document.getElementById('deco_amb');
  if(!cd||!num||!sel||cd.style.display==='none')return;
  const W=sel.getBoundingClientRect().right-num.getBoundingClientRect().left;cd.style.width=(W>200?W:200)+'px';
}
window.addEventListener('resize',fitCols);
function wBtn(tag,txt,href){const e=document.createElement(tag);e.className='wb';e.textContent=txt;if(tag==='a'){e.href=href;e.onclick=showPageLoadingOverlay;}else e.type='button';return e;}
function buildRows(){
  fillSel('deco_bg','bg',2);fillSel('deco_trigger','tg',2);fillSel('deco_main_order','mo',2);fillSel('deco_add_mode','am',2);
  bindNum('clock_interval');bindNum('clock_interval_min');bindNum('deco_add_count');
  glob();
  const box=document.getElementById('wbox');box.innerHTML='';
  WIDGETS.forEach(function(id){
    const r=document.createElement('div');r.className='row wrow';
    const l=document.createElement('label');l.textContent=tr('w'+id);r.appendChild(l);
    const s=document.createElement('select');s.id='deco_mode_'+id;s.className='wsel';
    [0,1,2].forEach(function(k){const o=document.createElement('option');o.value=k;o.textContent=tr('m'+k);s.appendChild(o);});
    s.value=V['deco_mode_'+id]||'0';s.onchange=function(){V[s.id]=s.value;sum();};r.appendChild(s);
    const n=document.createElement('input');n.type='number';n.id='deco_dur_'+id;n.className='wnum';n.min=1;n.max=(id===7?10:120);n.title=tr(id===7?'qdur':'dur');
    n.value=V['deco_dur_'+id]||DEFD[id];n.oninput=function(){V[n.id]=n.value;sum();};r.appendChild(n);
    const ac=document.createElement('div');ac.className='wact';r.appendChild(ac);
    let cd=null;
    if(id===0)ac.appendChild(wBtn('a',tr('choose_clock'),'/config/clock'));
    else{const p=wBtn('button',tr('prev'));p.onclick=function(){if((id===2||id===5)&&!placeOk()){placeAsk();return;}const ak=ambKeys(V.deco_amb||'0');fetch('/clock-preview',{method:'POST',body:'theme=w'+id+':'+(V.deco_amb||'0')+':'+(V['deco_dur_'+id]||DEFD[id])+':'+(V.deco_qtheme||'')+':'+(V[ak[0]]||'-')+':'+(V[ak[1]]||'-')+'@'+PLL(),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).catch(function(){});};ac.appendChild(p);}
    if(id===3)ac.appendChild(wBtn('a',tr('ev_btn'),'/config/events'));
    if(id===2||id===5)ac.appendChild(wBtn('a',tr('place_btn'),'/config/place'));
    if(id===6){const q=wBtn('button',tr('stats_reset'));q.onclick=function(){if(confirm(tr('stats_confirm')))fetch('/stats-reset',{method:'POST'}).then(function(){msgLocal(tr('stats_done'),true);}).catch(function(){msgLocal(tr('save_err'),false);});};ac.appendChild(q);}
    if(id===7){r.classList.add('top');const grp=document.createElement('div');grp.style.cssText='display:inline-flex;flex-direction:column;align-items:stretch;gap:6px';const r1=document.createElement('div');r1.style.cssText='display:flex;gap:6px';const pv=ac.lastChild;if(pv)r1.appendChild(pv);r1.appendChild(wBtn('a',tr('quotes_btn'),'/config/quotes'));grp.appendChild(r1);
      const qb=document.createElement('details');qb.style.cssText='position:relative;width:100%';
      const qs=document.createElement('summary');qs.className='wb';qs.style.cssText='list-style:none;background:#222;font-weight:normal;width:100%;justify-content:space-between';
      const qd=document.createElement('div');qd.style.cssText='position:absolute;z-index:5;top:100%;left:0;margin-top:2px;min-width:100%;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto;background:#222;border:1px solid #555;border-radius:6px;padding:6px 10px;white-space:nowrap';
      const sel=(V.deco_qtheme||'').split(',').filter(Boolean);
      const qsum=function(){const k=qd.querySelectorAll('input:checked');qs.textContent=(k.length===0?tr('q_all'):(k.length===1?k[0].dataset.n:tr('q_n').replace('{n}',k.length)))+'  \u25BE';};
      QT.forEach(function(nm){const lb=document.createElement('label');lb.style.cssText='flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:11px;line-height:14px;color:#eee;margin:0;padding:0';
        const cb=document.createElement('input');cb.type='checkbox';cb.dataset.n=nm;cb.checked=sel.indexOf(nm)>=0;cb.style.cssText='flex:0 0 12px;width:12px;height:12px;min-width:0;margin:0;padding:0';
        cb.onchange=function(){V.deco_qtheme=Array.from(qd.querySelectorAll('input:checked')).map(function(e){return e.dataset.n;}).join(',');qsum();};
        lb.appendChild(cb);lb.appendChild(document.createTextNode(nm));qd.appendChild(lb);});
      qb.appendChild(qs);qb.appendChild(qd);qsum();grp.appendChild(qb);ac.appendChild(grp);}
    if(id===4){const a=document.createElement('select');a.id='deco_amb';a.className='wsel';for(let k=0;k<9;k++){const o=document.createElement('option');o.value=k;o.textContent=tr('amb'+k);a.appendChild(o);}a.value=V.deco_amb||'0';const acol=document.createElement('div');acol.className='acol';acol.appendChild(a);   // liste des styles a sa place d'origine ; les couleurs + AUTO / RAZ juste dessous, alignees sur son bord gauche
      cd=document.createElement('div');cd.className='wcol';acol.appendChild(cd);ac.appendChild(acol);r.classList.add('top');ac.style.alignItems='flex-start';a.onchange=function(){V.deco_amb=a.value;colRow(cd);fitCols();};}
    if(cd)colRow(cd);
    const h=document.createElement('div');h.className='hint';h.textContent=tr('w'+id+'d');r.appendChild(h);
    box.appendChild(r);
    if(id===4)fitCols();
    if(id===5||id===4){const g=document.createElement('div');g.className='wgap';box.appendChild(g);}   // sections : apres Meteo et apres Ambiance
  });
}function defDur(){WIDGETS.forEach(function(id){V['deco_dur_'+id]=String(DEFD[id]);const e=document.getElementById('deco_dur_'+id);if(e)e.value=DEFD[id];});sum();msgLocal(tr('defdur_done'),true);}
function sum(){
  const main=[],add=[];
  WIDGETS.forEach(function(id){const m=V['deco_mode_'+id],d=V['deco_dur_'+id]||DEFD[id];const e=tr('w'+id)+' ('+d+(id===7?' '+tr('qn'):tr('sec'))+')';if(m==='1')main.push(e);else if(m==='2')add.push(e);});
  const act=main.length||add.length;
  document.getElementById('cyc').textContent=!act?tr('inactive'):(V.deco_bg==='1'?tr('cont'):V.deco_trigger==='1'?tr('every_min').replace('{n}',V.clock_interval_min||'?'):tr('every_gifs').replace('{n}',V.clock_interval||'?'));
  document.getElementById('seq1').textContent=main.length?main.join(' / ')+(V.deco_main_order==='1'?' ('+tr('rr')+')':''):'-';
  document.getElementById('seq2').textContent=add.length?((V.deco_add_mode==='1'?tr('rnd').replace('{n}',Math.min(Number(V.deco_add_count)||1,add.length))+' ':'')+add.join(' + ')):'-';
}
function render(){
  document.documentElement.lang=currentLang;document.title=tr('title');
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.innerHTML=tr(el.dataset.i18n);});
  document.getElementById('langSelect').value=currentLang;
  buildRows();sum();document.getElementById('defDurBt').onclick=defDur;
}
function applyLang(backend){
  const s=localStorage.getItem('dmd_lang');
  if(s&&PAGE_I18N[s])currentLang=s;else if(backend&&PAGE_I18N[backend])currentLang=backend;else{const n=(navigator.language||'').substring(0,2);currentLang=PAGE_I18N[n]?n:'fr';}
  render();
}
function setLang(c){localStorage.setItem('dmd_lang',c);applyLang();fetch('/save-language',{method:'POST',body:'language='+c,headers:{'Content-Type':'application/x-www-form-urlencoded'}}).catch(function(){});}
var _wLoaded=false,Vbase={};
function loadDraftW(){const d=wdGet();return Object.keys(d).length?d:null;}
var Vseen={};   /* v353 : seules les cles changees PAR CETTE PAGE sont ecrites/effacees dans le brouillon (un onglet ouvert n'ecrase plus les choix faits ailleurs) */
function syncFromDraftW(){const dr=wdGet();Object.keys(V).forEach(function(k){if(V[k]===Vseen[k]){const n=dr[k]!==undefined?dr[k]:Vbase[k];if(V[k]!==n)V[k]=Vseen[k]=n;}});}
function saveDraftW(){if(!_wLoaded)return;const o={},del=[];Object.keys(V).forEach(function(k){if(V[k]===Vseen[k])return;if(V[k]!==Vbase[k])o[k]=V[k];else del.push(k);Vseen[k]=V[k];});wdPatch(o,del);}
['change','input','click'].forEach(function(ev){document.addEventListener(ev,function(){setTimeout(saveDraftW,0);});});
window.addEventListener('storage',function(e){if(e.key==='dmd_draft_widgets'&&_wLoaded){syncFromDraftW();render();}});
function placeOk(){const d=D||{};const la=Number(V.deco_lat!==undefined?V.deco_lat:d.deco_lat)||0,lo=Number(V.deco_lon!==undefined?V.deco_lon:d.deco_lon)||0;return !(la===0&&lo===0);}
function PLL(){const d=D||{};return (V.deco_lat!==undefined?V.deco_lat:d.deco_lat||0)+','+(V.deco_lon!==undefined?V.deco_lon:d.deco_lon||0);}
function placeAsk(){if(confirm(tr('need_place'))){showPageLoadingOverlay();location.href='/config/place';}}
function saveDeco(){
  if(V.deco_bg==='1'&&!WIDGETS.some(function(id){return (V['deco_mode_'+id]||'0')!=='0';})){msgLocal(tr('need_widget'),false);alert(tr('need_widget'));return;}
  syncFromDraftW();   // v353 : reprend le brouillon le plus recent pour les cles que cette page n'a pas changees
  msg(tr('saving'),true);   // meme affichage que les autres pages : « Enregistrement... » sur le DMD des le clic
  const p=new URLSearchParams();
  WIDGETS.forEach(function(id){p.set('deco_mode_'+id,V['deco_mode_'+id]||'0');p.set('deco_dur_'+id,V['deco_dur_'+id]||'8');});
  Object.keys(GK).forEach(function(k){p.set(k,V[k]||GK[k]);});
  if(!(Number(p.get('clock_interval'))>=1))p.set('clock_interval','10');
  if(!(Number(p.get('clock_interval_min'))>=1))p.set('clock_interval_min','5');
  fetch('/save',{method:'POST',body:wdBodyAll(p),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.text()).then(x=>{const ok=x.includes('OK');msg(ok?tr('saving'):x,ok);if(ok){wdClearAll();}if(ok&&x.includes('RESTORED')){msg(tr('rb_restart'),true);setTimeout(function(){fetch('/reboot').catch(function(){});},900);}else if(ok&&x.includes('NOPLAYLIST')){msgLocal(tr('no_pl'),false);}}).catch(()=>msgLocal(tr('save_err'),false));
}
function resumeDmd(){fetch('/dmd-resume',{method:'POST'}).then(()=>msgLocal(tr('resumed'),true)).catch(()=>msgLocal(tr('save_err'),false));}
function loadQT(){fetch('/quotes-list?lang='+currentLang).then(r=>r.json()).then(function(L){QT=L.map(function(x){return x.n;});buildRows();}).catch(function(){});}
function fetchTimeout(u,o,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({},o,{signal:c.signal})).finally(()=>clearTimeout(t));}
function loadConfig(){return fetchTimeout('/load',{},45000).catch(()=>fetchTimeout('/load',{},45000)).then(r=>r.json()).then(d=>{D=d;
  WIDGETS.forEach(function(id){V['deco_mode_'+id]=d['deco_mode_'+id]||'0';V['deco_dur_'+id]=d['deco_dur_'+id]||'8';});
  Object.keys(GK).forEach(function(k){let v=d[k];if(v===undefined||v==='')v=GK[k];if((k==='clock_interval'||k==='clock_interval_min')&&!(Number(v)>=1))v=GK[k];V[k]=v;});
  Vbase=Object.assign({},V);const dr=loadDraftW();let drw=false;if(dr){Object.keys(dr).forEach(function(k){if(dr[k]!==undefined&&dr[k]!==null&&dr[k]!==''){if(/^(deco_|clock_interval)/.test(k)&&V[k]!==dr[k])drw=true;V[k]=dr[k];}});}   /* v352 : selections non enregistrees restaurees (Widgets + Lieu + Evenements + Couleurs) */
  Vseen=Object.assign({},V);_wLoaded=true;render();loadQT();if(drw)msgLocal(tr('draft_restored'),true);}).catch(()=>msgLocal(tr('load_err'),false));}
fetchTimeout('/lang',{},45000).then(r=>r.json()).then(d=>{applyLang(d.language);return loadConfig();}).catch(()=>{applyLang();return loadConfig();}).finally(hidePageLoadingOverlay);
</script>
